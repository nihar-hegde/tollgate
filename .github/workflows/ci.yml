name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The database tests (packages/db) need a real Postgres.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tollgate
          POSTGRES_PASSWORD: tollgate
          POSTGRES_DB: tollgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tollgate -d tollgate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm secrets:scan
